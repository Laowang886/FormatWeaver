#Responsible for enabling one-click local startup of independent, isolated container services (Redis and PostgreSQL).

version: '3.8'

services:
  #only run the redis service if the environment variable REDIS_ENABLED is set to true
  redis:
    image: redis:latest
    container_name: formatWeaver_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

#make sure to create the volume for redis data persistence
volumes:
  redis_data: