services:
  #redis
  redis:
    image: redis:latest
    container_name: formatWeaver_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  #postgres
  postgres:
    image: postgres:16-alpine
    container_name: formatWeaver_postgres
    restart: always
    environment:
      POSTGRES_USER: formatweaver
      POSTGRES_PASSWORD: formatweaver
      POSTGRES_DB: formatweaver
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  worker:
    image: node:20-alpine
    container_name: formatWeaver_worker
    working_dir: /app
    command: sh -c "npm install && npm run worker"
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://formatweaver:formatweaver@postgres:5432/formatweaver
      STORAGE_DIR: /app/storage
    volumes:
      - ./:/app
    depends_on:
      - redis
      - postgres

volumes:
  redis_data:
  postgres_data: